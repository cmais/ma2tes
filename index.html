<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <style>
        body {
            background-color: black;
            color: yellow;
            font-family: Arial, sans-serif;
            font-size: 15px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
            border: 2px solid yellow;
            border-radius: 10px;
            max-width: 600px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo!</h1>
        <p>É um prazer ter você aqui.</p>
        <p>Esperamos que aproveite a sua visita.</p>
    </div>
</body>
</html>
